[package]
name = "agentic-loop-bin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "agentic-loop binary — wires traits to implementations (OSS)"

[[bin]]
name = "agentic-loop"
path = "src/main.rs"

[dependencies]
agentic-loop-types = { workspace = true }
