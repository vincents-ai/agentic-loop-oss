[package]
name = "agentic-loop-tools-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Built-in tool implementations (file ops, shell, engram, workspace)"

[dependencies]
agentic-loop-types = { workspace = true }
agentic-loop-tools = { workspace = true }
agentic-loop-storage = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
gix = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
glob = "0.3"
reqwest = { version = "0.13.2", features = ["json"] }
engram = { workspace = true }

[features]
default = []

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
